settings:
  content:
    merge: true

media:
  - name: images
    label: Images
    input: static/img
    output: /img
    categories: [image]
    rename: safe

content:
  - name: pages
    label: Pages
    type: collection
    path: docs
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [index.md]
    view:
      primary: title
      sort: [sidebar_position, title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: sidebar_position
        label: Position in menu
        type: number
      - name: body
        label: Content
        type: rich-text
        options:
          media: images

  - name: home
    label: Home page
    type: file
    path: docs/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Content
        type: rich-text
        options:
          media: images
