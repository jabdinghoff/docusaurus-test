# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.220.0/schema/sveltia-cms.json
backend:
  name: github
  repo: jabdinghoff/docusaurus-test
  branch: main

media_folder: static/img
public_folder: /img

collections:
  - name: pages
    label: Pages
    folder: docs
    extension: md
    format: frontmatter
    create: true
    slug: "{{title}}"
    nested:
      depth: 5
      subfolders: false
    # Adds the Parent Folder picker and the New Folder button.
    meta: { path: {} }
    # index.md is the home page and is edited below. In a filter, `slug` is the entry's file path
    # inside the folder, not the front matter key.
    filter: { field: slug, pattern: "^(?!index$)" }
    sortable_fields: [sidebar_position, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: sidebar_position
        label: Position in menu
        widget: number
        value_type: int
        required: false
      - name: body
        label: Content
        widget: richtext
        editor_components: [admonition, details, tabs, mdx-import, mdx-export, kbd, anchor, variable, image, code-block]
        # With a multi-line editor component, Sveltia's Markdown shortcuts delete any single
        # character typed before a space at the start of a paragraph.
        use_markdown_shortcuts: false

  - name: home
    label: Home page
    files:
      - name: index
        label: Home page
        file: docs/index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: slug, label: Slug, widget: hidden, default: / }
          - { name: sidebar_position, label: Position in menu, widget: hidden, default: 1 }
          - name: body
            label: Content
            widget: richtext
            editor_components: [admonition, details, tabs, mdx-import, mdx-export, kbd, anchor, variable, image, code-block]
            use_markdown_shortcuts: false

  # A German page is matched to its English original by file name, so German pages are only
  # edited here, never created or deleted.
  - name: pages-de
    label: Pages (Deutsch)
    folder: i18n/de/docusaurus-plugin-content-docs/current
    extension: md
    format: frontmatter
    create: false
    delete: false
    nested:
      depth: 5
      subfolders: false
    filter: { field: slug, pattern: "^(?!index$)" }
    sortable_fields: [sidebar_position, title]
    fields:
      - { name: title, label: Titel, widget: string }
      - name: sidebar_position
        label: Position im Menü
        widget: number
        value_type: int
        required: false
      - name: body
        label: Inhalt
        widget: richtext
        editor_components: [admonition, details, tabs, mdx-import, mdx-export, kbd, anchor, variable, image, code-block]
        use_markdown_shortcuts: false

  - name: home-de
    label: Startseite (Deutsch)
    files:
      - name: index
        label: Startseite
        file: i18n/de/docusaurus-plugin-content-docs/current/index.md
        fields:
          - { name: title, label: Titel, widget: string }
          - { name: slug, label: Slug, widget: hidden, default: / }
          - { name: sidebar_position, label: Position im Menü, widget: hidden, default: 1 }
          - name: body
            label: Inhalt
            widget: richtext
            editor_components: [admonition, details, tabs, mdx-import, mdx-export, kbd, anchor, variable, image, code-block]
            use_markdown_shortcuts: false
